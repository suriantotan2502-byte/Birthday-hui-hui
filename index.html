<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy Birthday Hui Hui 💗</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(circle, #101828, #02040a);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.loadingText {
    font-size: 18px;
    letter-spacing: 2px;
}

/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background:
        radial-gradient(circle at center,
        rgba(255, 100, 200, .18),
        transparent 45%),
        #02040a;
    color: white;
}

#countdown {
    font-size: 100px;
    font-weight: bold;
    color: #ff8edb;
    text-shadow:
        0 0 15px #ff5bc7,
        0 0 40px #ff5bc7,
        0 0 80px #ff5bc7;
}

#openButton {
    margin-top: 30px;
    padding: 14px 32px;
    border: 1px solid #8fffff;
    border-radius: 30px;
    background: rgba(0,255,255,.08);
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow:
        0 0 15px rgba(0,255,255,.5);
}

#openButton:active {
    transform: scale(.95);
}

/* =========================
   TITLE
========================= */

#title {
    position: fixed;
    top: 5%;
    left: 0;
    width: 100%;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    color: white;
    text-shadow:
        0 0 8px #ff6fd5,
        0 0 25px #ff6fd5,
        0 0 45px #61ffff;
}

#title h1 {
    margin: 0;
    font-size: clamp(28px, 8vw, 55px);
    letter-spacing: 4px;
}

#title p {
    margin-top: 8px;
    color: #bfffff;
    letter-spacing: 3px;
}

/* =========================
   INSTRUCTION
========================= */

#instruction {
    position: fixed;
    bottom: 3%;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.65);
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
}
  
</style>
</head>

<body>

<div id="loading">
    <div class="loadingText">
        Preparing something special... 💗
    </div>
</div>

<div id="intro">

    <div id="countdown">3</div>

    <button id="openButton">
        OPEN MY BIRTHDAY 💗
    </button>

</div>

<div id="title">
    <h1>祝你生日快樂</h1>
    <p>Huiiii Huiiii • 15 ✨</p>
</div>

<div id="instruction">
    滑動/拖曳以旋轉 3D 世界 ✨
</div>
<audio id="birthdayMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls }
    from "three/addons/controls/OrbitControls.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 10);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


/* =========================================================
   CONTROLS
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.enableZoom = false;

controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;

controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;


/* =========================================================
   LIGHTS
========================================================= */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1.5
);

scene.add(ambientLight);


const pinkLight = new THREE.PointLight(
    0xff55cc,
    20,
    30
);

pinkLight.position.set(
    -5,
    2,
    -5
);

scene.add(pinkLight);


const cyanLight = new THREE.PointLight(
    0x55ffff,
    18,
    30
);

cyanLight.position.set(
    5,
    -2,
    -5
);

scene.add(cyanLight);


/* =========================================================
   PARTICLES
========================================================= */

const particleGeometry =
    new THREE.BufferGeometry();

const particleCount = 1500;

const particlePositions =
    new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {

    particlePositions[i * 3] =
        (Math.random() - .5) * 40;

    particlePositions[i * 3 + 1] =
        (Math.random() - .5) * 35;

    particlePositions[i * 3 + 2] =
        (Math.random() - .5) * 40;
}

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({
        color: 0xbfffff,
        size: 0.035,
        transparent: true,
        opacity: .8
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


/* =========================================================
   MAIN GROUP
========================================================= */

const mainGroup =
    new THREE.Group();

scene.add(mainGroup);


/* =========================================================
   PHOTO
========================================================= */

const photoGroup =
    new THREE.Group();
photoGroup.position.z = -5;
mainGroup.add(photoGroup);

const textureLoader =
    new THREE.TextureLoader();

textureLoader.load(
    "hui.jpg",

    function(texture) {

        texture.colorSpace =
            THREE.SRGBColorSpace;


        const frameGeometry =
            new THREE.CircleGeometry(
                2.35,
                96
            );

        const frameMaterial =
            new THREE.MeshBasicMaterial({
                color: 0xff6fd5,
                transparent: true,
                opacity: .25,
                side: THREE.DoubleSide
            });

        const frame =
            new THREE.Mesh(
                frameGeometry,
                frameMaterial
            );

        frame.position.z = 0;

        photoGroup.add(frame);


        const photoGeometry =
            new THREE.CircleGeometry(
                2.2,
                96
            );

        const photoMaterial =
            new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
            });

        const photo =
            new THREE.Mesh(
                photoGeometry,
                photoMaterial
            );

        photo.position.z = 0.1;
        photo.renderOrder = 10;

        photoGroup.add(photo);


        const backingGeometry =
            new THREE.CylinderGeometry(
                2.23,
                2.23,
                0.35,
                96
            );

        const backingMaterial =
            new THREE.MeshBasicMaterial({
                color: 0xff6fd5
            });

        const backing =
            new THREE.Mesh(
                backingGeometry,
                backingMaterial
            );

        backing.rotation.x =
            Math.PI / 2;

        backing.position.z =
            -0.25;

        photoGroup.add(backing);


        createRing(2.65, 0xff6fd5, 0.5);
        createRing(2.9, 0x66ffff, -0.8);
        createRing(3.15, 0xff9ee6, 1.3);
        createRing(3.45, 0x8fffff, -0.6);
        createRing(3.8, 0xff55cc, 0.4);

    },

    undefined,

    function(error) {

        console.error(
            "foto.jpg tidak ditemukan.",
            error
        );

    }
);


/* =========================================================
   RINGS
========================================================= */

const ringObjects = [];


function createRing(
    radius,
    color,
    rotationSpeed
) {

    const geometry =
        new THREE.TorusGeometry(
            radius,
            0.035,
            12,
            120
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: .8
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.position.z = -5;

    ring.rotation.x =
        Math.PI / 2;

    ring.userData.speed =
        rotationSpeed;

    mainGroup.add(ring);

    ringObjects.push(ring);
}


/* =========================================================
   TEXT SPRITES
========================================================= */

function createTextTexture(
    text,
    color = "#ffffff"
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        "bold 70px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = color;
    ctx.shadowBlur = 25;

    ctx.fillStyle = color;

    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


function addText(
    text,
    x,
    y,
    z,
    scale = 1,
    color = "#ffffff",
    rotation = 0
) {

    const texture =
        createTextTexture(
            text,
            color
        );

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            depthTest: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.position.set(
        x,
        y,
        z
    );

    sprite.scale.set(
        3.2 * scale,
        .8 * scale,
        1
    );

    sprite.material.rotation = rotation;

    sprite.userData.baseX = x;
    sprite.userData.baseY = y;
    sprite.userData.baseZ = z;
    sprite.userData.offset =
        Math.random() * Math.PI * 2;

    mainGroup.add(sprite);

    return sprite;
}


/* =========================================================
   FLOATING MESSAGES
========================================================= */

const messages = [

    ["HAPPY BIRTHDAY 💗", -4.5, 3.2, -2],
    ["Hui Hui ✨", 3.5, 3.5, -1],

    ["YOU ARE BEAUTIFUL 💕", -5, 1.5, -3],
    ["SHINE BRIGHT ✨", 4.5, 1.8, -2],

    ["STAY HAPPY 🌸", -4.8, -.5, -2],
    ["KEEP SMILING 😊", 4.3, -.7, -1],

    ["YOU DESERVE THE BEST 💕", -4, -2.5, -3],
    ["MAKE A WISH ⭐", 3.8, -2.3, -2],

    ["15 YEARS OLD 🎂", -2.8, 4.5, -4],
    ["GOOD LUCK ✨", 2.7, 4.7, -3],

    ["LOTS OF LOVE 💖", -5, -4, -4],
    ["DREAM BIG 🌙", 4.7, -3.8, -3],

    ["BE HAPPY FOREVER 💗", 0, 4.5, -5],

    ["YOU ARE SPECIAL 💞", -6.2, 2.8, -4],
    ["NEVER GIVE UP ✨", 6.1, 2.7, -4],
    ["HAVE A MAGICAL DAY 🌟", -6.3, .2, -5],
    ["YOU MAKE LIFE BRIGHT 💖", 6.2, .1, -4],
    ["ENJOY YOUR DAY 🎉", -6, -1.8, -5],
    ["FOLLOW YOUR DREAMS 🌙", 6, -1.7, -5],
    ["LOVE YOU ALWAYS 💗", -2.2, -4.8, -5],
    ["CELEBRATE YOU 🎂", 2.4, -4.7, -4],
    ["SMILE EVERY DAY 😊", -6.5, 4.2, -6],
    ["BIRTHDAY GIRL 👑", 6.4, 4.1, -5],
    ["YOU GLOW ✨", -3.8, 5.4, -6],
    ["WISHES COME TRUE ⭐", 3.9, 5.3, -6],
    ["SWEETEST SOUL 🌸", -6.5, -3.4, -6],
    ["ENDLESS HAPPINESS 💕", 6.5, -3.3, -6],

    ["MAY ALL YOUR DREAMS COME TRUE 💫", -8, 6.2, -8],
    ["YOU MAKE EVERY DAY SPECIAL 💗", 8, 6, -7],
    ["HAPPY MOMENTS AHEAD 🌸", -8.2, 4.8, -9],
    ["KEEP SHINING, ALICE ✨", 8.3, 4.6, -8],
    ["YOUR SMILE IS MAGIC 😊", -8.5, 2.8, -7],
    ["NEVER STOP DREAMING 🌙", 8.4, 2.6, -9],
    ["BORN TO SHINE 👑", -8.6, .5, -8],
    ["YOU ARE ONE OF A KIND 💞", 8.5, .4, -7],
    ["HAPPINESS SURROUNDS YOU 🎉", -8.3, -1.8, -9],
    ["TODAY IS ALL ABOUT YOU 💖", 8.2, -1.7, -8],
    ["MAY YOUR HEART BE FULL 💕", -8, -3.8, -7],
    ["MAGICAL MEMORIES FOREVER ⭐", 8, -3.7, -9],
    ["LOVE, LAUGHTER AND JOY 🌈", -7.5, -5.5, -8],
    ["CELEBRATE EVERY LITTLE THING 🎂", 7.6, -5.3, -7],

    ["FRONT • BACK • TOP • BOTTOM 💗", 0, 7, -10],
    ["ALICE'S SPECIAL UNIVERSE ✨", 0, -7, -10],
    ["SURROUNDED BY LOVE 💖", -10, 0, -10],
    ["ALWAYS LOVED, ALWAYS SPECIAL 💞", 10, 0, -10],
    ["HAPPY BIRTHDAY ALICE 🎉", 0, 8.5, -12],
    ["WISHING YOU ENDLESS JOY 🌟", 0, -8.5, -12]
];


const textSprites = [];


messages.forEach(
    (data, index) => {

        const sprite =
            addText(
                data[0],
                data[1],
                data[2],
                data[3],
                .48 + Math.random() * .25,
                index % 2 === 0
                    ? "#ff8edb"
                    : "#8fffff",
                (Math.random() - .5) * .18
            );

        textSprites.push(sprite);
    }
);


/* =========================================================
   EXTRA FLOATING TEXT
========================================================= */

const extraFloatingMessages = [
    "LOVE YOU ALWAYS 💗",
    "YOU ARE AMAZING ✨",
    "HAVE THE BEST BIRTHDAY 🎂",
    "SMILE, SHINE, REPEAT 💕",
    "ALICE FOREVER 🌸",
    "DREAMS ARE WAITING 🌙",
    "YOU DESERVE HAPPINESS 💖",
    "MAKE TODAY UNFORGETTABLE 🎉",
    "GLOW LIKE A STAR ⭐",
    "SENDING BIG HUGS 🤗",
    "YOUR DAY, YOUR MAGIC 💫",
    "KEEP BEING YOU 💞",
    "SO MANY BEAUTIFUL MEMORIES 🌈",
    "BIRTHDAY LOVE IS EVERYWHERE 💗",
    "YOU BRING LIGHT TO THE WORLD ✨",
    "CHEERS TO 15 YEARS 🥳",
    "MAY YOUR DAY SPARKLE 🌟",
    "YOU ARE PURE SUNSHINE ☀️",
    "FOREVER YOUNG AT HEART 💕",
    "CELEBRATE, LAUGH, AND LOVE 🎊"
];

for (let i = 0; i < 45; i++) {

    const angle =
        Math.random() * Math.PI * 2;

    const radius =
        5.5 + Math.random() * 6;

    const x =
        Math.cos(angle) * radius;

    const y =
        (Math.random() - .5) * 15;

    const z =
        -3 - Math.random() * 12;

    const sprite =
        addText(
            extraFloatingMessages[
                i % extraFloatingMessages.length
            ],
            x,
            y,
            z,
            .28 + Math.random() * .22,
            i % 2 === 0
                ? "#ff9ee6"
                : "#9fffff",
            (Math.random() - .5) * .35
        );

    sprite.userData.floatSpeed =
        .35 + Math.random() * .7;

    sprite.userData.floatDistance =
        .15 + Math.random() * .35;

    textSprites.push(sprite);
}


/* =========================================================
   HEARTS
========================================================= */

const hearts = [
    [-4, 2.8, -1],
    [4, 2.5, -2],
    [-4, -2, -1],
    [4, -2.5, -2],
    [0, 4, -3],
    [0, -4, -3],
    [-6, 1.2, -4],
    [6, 1.4, -4],
    [-5.8, -1, -5],
    [5.8, -.9, -5],
    [-2.5, 5.2, -5],
    [2.6, 5.1, -5],
    [-2.8, -5.1, -5],
    [2.9, -5, -5],
    [-8, 6.5, -8],
    [8, 6.4, -8],
    [-8.5, -6.2, -9],
    [8.4, -6.1, -9],
    [-10, 3.5, -11],
    [10, 3.4, -11],
    [-10, -3.2, -11],
    [10, -3.1, -11]
];


hearts.forEach(
    (pos, index) => {

        const heart =
            addText(
                index % 2 === 0
                    ? "💗"
                    : "💖",
                pos[0],
                pos[1],
                pos[2],
                .7,
                "#ff8edb"
            );

        textSprites.push(heart);
    }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    particles.rotation.y =
        time * .015;

    particles.rotation.x =
        Math.sin(time * .1) * .03;


    textSprites.forEach(
        (sprite, index) => {

            const speed =
                sprite.userData.floatSpeed || .7;

            const distance =
                sprite.userData.floatDistance || .18;

            sprite.position.y =
                sprite.userData.baseY +
                Math.sin(
                    time * speed +
                    sprite.userData.offset
                ) * distance;

            sprite.position.x =
                sprite.userData.baseX +
                Math.cos(
                    time * speed * .65 +
                    sprite.userData.offset
                ) * distance * .45;

            sprite.position.z =
                sprite.userData.baseZ +
                Math.sin(
                    time * speed * .45 +
                    sprite.userData.offset
                ) * .12;

            sprite.material.opacity =
                .65 +
                Math.sin(
                    time * 1.5 +
                    index
                ) * .25;
        }
    );


    ringObjects.forEach(
        (ring) => {

            ring.rotation.z +=
                0.003 *
                ring.userData.speed;

            ring.rotation.y +=
                0.001 *
                ring.userData.speed;
        }
    );


    photoGroup.position.y =
        Math.sin(time * .8) * .08;

    photoGroup.rotation.y =
        Math.sin(time * .35) * .04;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   INTRO
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );

const intro =
    document.getElementById(
        "intro"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const birthdayMusic =
    document.getElementById(
        "birthdayMusic"
    );
setTimeout(
    () => {

        loading.style.display =
            "none";

        intro.style.display =
            "flex";

    },
    1200
);


openButton.addEventListener(
    "click",
    () => {
birthdayMusic.play();
        openButton.style.display =
            "none";

        let number = 3;

        countdown.textContent =
            number;


        const timer =
            setInterval(
                () => {

                    number--;

                    if (number > 0) {

                        countdown.textContent =
                            number;

                    } else {

                        clearInterval(timer);

                        countdown.textContent =
                            "💗";

                        setTimeout(
                            () => {

                                intro.style.display =
                                    "none";

                            },
                            700
                        );
                    }

                },
                900);
    }
);
  
</script>

</body>
</html>
